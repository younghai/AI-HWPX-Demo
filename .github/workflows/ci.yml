name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 커밋된 .npmrc의 store-dir은 로컬 워크스페이스 공유 경로(/Users/...)라
      # Linux 러너에서 EACCES — CI에서는 러너 로컬 store로 교체한다.
      - name: Use runner-local pnpm store
        run: echo "store-dir=$HOME/.pnpm-store" > .npmrc

      - uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Node dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python dev dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint client (catches undefined refs — the ErrorBoundary-class bug)
        run: pnpm -C client lint

      - name: Client unit tests
        run: pnpm -C client test

      - name: Server unit tests
        run: pnpm -C server test
        env:
          NODE_ENV: test

      - name: Client production build
        run: pnpm -C client build

      - name: Server module syntax
        run: |
          cd server
          for f in index.js lib/*.js services/*.js routes/*.js; do node --check "$f"; done

      - name: Python syntax
        run: python -m py_compile scripts/build_hwpx.py scripts/diagram_templates.py

      - name: Python regression suite (R5/R6/NFC/escape/atomic-write)
        run: python -m pytest scripts/tests -q
